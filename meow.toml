[project]
name = "MangaLib6"
kind = "app"
archs = ["armv7"]
min_ios = "5.1"
info_plist = "Info.plist"
resources = "Resources"
frameworks = ["Foundation", "UIKit", "CoreGraphics", "QuartzCore"]
cflags = ["-Wall", "-Wextra", "-Wno-unused-parameter", "-Isrc"]

[package]
id = "ru.mangapad.apitest"
name = "MangaLib6"
version = "@Info.plist:CFBundleShortVersionString"
description = "MangaLib reader with chapter downloads for iPhone and iPad"
maintainer = "tayga16"
section = "Applications"
depends = "firmware (>= 5.1), uikittools"
packages_stanza = true
scripts = { postinst = "packaging/postinst", postrm = "packaging/postrm" }
fields = { Homepage = "https://github.com/tayga16/MangaLib6", Icon = "http://tayga16.ru/repo/CydiaIcon.png" }
