# Add these locations INSIDE the existing HTTP server block for tayga16.ru.
# Keep /repo available on port 80 for legacy Cydia.
location = /repo {
    return 301 http://tayga16.ru/repo/;
}

location ^~ /repo/ {
    alias /var/www/tayga16/repo/;
    index index.html;
    autoindex off;
    default_type application/octet-stream;
    add_header Cache-Control "no-cache";
}
